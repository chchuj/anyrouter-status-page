<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anyrouter Status</title>
    <link rel="stylesheet" href="./style.css?v=20260418-2">
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">STATUS PAGE</p>
          <h1>Anyrouter Status</h1>
          <p class="subtitle">监控项：模拟 Claude Code 请求，验证多个 anyrouter 账号是否能返回 1 个 token。</p>
        </div>
        <div class="meta">
          <span id="lastUpdated">加载中...</span>
        </div>
      </header>

      <section id="overallBanner" class="banner banner-neutral">
        正在加载状态...
      </section>

      <section class="summary-grid" id="summaryGrid">
        <article class="summary-card">
          <span class="summary-label">账号总数</span>
          <strong id="summaryTotal">-</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">正常</span>
          <strong id="summaryOperational">-</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">部分失败</span>
          <strong id="summaryDegraded">-</strong>
        </article>
        <article class="summary-card">
          <span class="summary-label">故障</span>
          <strong id="summaryOutage">-</strong>
        </article>
      </section>

      <section>
        <div class="section-header">
          <div>
            <h2>账号状态面板</h2>
            <p class="muted">每张卡片对应 1 个账号；账号名称已脱敏显示。</p>
          </div>
        </div>
        <div id="accountsGrid" class="accounts-grid"></div>
      </section>
    </main>

    <div id="gridTooltip" class="grid-tooltip" hidden></div>
    <script src="./app.js?v=20260418-2"></script>
  </body>
</html>
