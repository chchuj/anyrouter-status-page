name: anyrouter-status-check

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

concurrency:
  group: anyrouter-status-check
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe and update data
        env:
          ANYROUTER_API_BASE: ${{ secrets.ANYROUTER_API_BASE }}
          ANYROUTER_MODEL: ${{ secrets.ANYROUTER_MODEL }}

          ANYR_01_NAME: ${{ secrets.ANYR_01_NAME }}
          ANYR_01_API_KEY: ${{ secrets.ANYR_01_API_KEY }}

          ANYR_02_NAME: ${{ secrets.ANYR_02_NAME }}
          ANYR_02_API_KEY: ${{ secrets.ANYR_02_API_KEY }}

          ANYR_03_NAME: ${{ secrets.ANYR_03_NAME }}
          ANYR_03_API_KEY: ${{ secrets.ANYR_03_API_KEY }}

          ANYR_04_NAME: ${{ secrets.ANYR_04_NAME }}
          ANYR_04_API_KEY: ${{ secrets.ANYR_04_API_KEY }}

          ANYR_05_NAME: ${{ secrets.ANYR_05_NAME }}
          ANYR_05_API_KEY: ${{ secrets.ANYR_05_API_KEY }}

          ANYR_06_NAME: ${{ secrets.ANYR_06_NAME }}
          ANYR_06_API_KEY: ${{ secrets.ANYR_06_API_KEY }}

          ANYR_07_NAME: ${{ secrets.ANYR_07_NAME }}
          ANYR_07_API_KEY: ${{ secrets.ANYR_07_API_KEY }}

          ANYR_08_NAME: ${{ secrets.ANYR_08_NAME }}
          ANYR_08_API_KEY: ${{ secrets.ANYR_08_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/check_anyrouter.py

      - name: Commit updated dashboard data back to repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/dashboard.json docs/data/status.json docs/data/history.json || true

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(status): refresh multi-account dashboard data"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
